databases:
  - name: ai-health-db
    plan: free
    databaseName: ai_health_db
    user: ai_health_user

services:
  - type: web
    name: ai-health-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: ai-health-db
          property: connectionString
      - key: SECRET_KEY
        value: prod-secure-secret-key-32-chars-minimum-health-agent-2026
      - key: JWT_SECRET_KEY
        value: prod-jwt-secret-key-health-agent-token-2026
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_API_KEY
        sync: false
